<div class="toast-stack">
  @for (n of notificationService.incoming(); track n.id) {
    <div class="toast" [class.success]="n.kind === 'success'">
      <div class="toast-body">
        <div class="toast-title">{{ n.title }}</div>
        <div class="toast-text">{{ n.body }}</div>
      </div>
      <button type="button" class="toast-close" (click)="notificationService.dismiss(n.id)">✕</button>
    </div>
  }
</div>
