<form class="post-form" [formGroup]="form" (ngSubmit)="submit()">

  <header class="form-head">
    <h1>Post an errand</h1>
    <a class="cancel" routerLink="/">Cancel</a>
  </header>

  <div class="field">
    <label for="title">What needs doing</label>
    <input id="title" type="text" formControlName="title" placeholder="e.g. Collect my parcel from PostNet" />
  </div>

  <div class="field">
    <label for="description">Details</label>
    <textarea
      id="description"
      formControlName="description"
      rows="3"
      placeholder="Anything the runner needs to know"
    ></textarea>
  </div>

  <div class="field">
    <label>Category</label>
    <div class="chiprow">
      @for (cat of categories; track cat) {
        <button
          type="button"
          class="cat"
          [class.active]="form.controls.category.value === cat"
          (click)="form.controls.category.setValue(cat)"
        >
          {{ categoryLabels[cat] }}
        </button>
      }
    </div>
  </div>

  <fieldset class="field" formGroupName="pickupAddress">
    <label>Pickup address</label>
    <input type="text" formControlName="line1" placeholder="Street address" />
    <div class="two-col">
      <input type="text" formControlName="suburb" placeholder="Suburb" />
      <input type="text" formControlName="city" placeholder="City" />
    </div>
    <div class="two-col">
      <input type="text" formControlName="province" placeholder="Province" />
      <input type="text" formControlName="postalCode" placeholder="Postal code" />
    </div>
  </fieldset>

  <fieldset class="field" formGroupName="dropoffAddress">
    <label>Drop-off address</label>
    <input type="text" formControlName="line1" placeholder="Street address" />
    <div class="two-col">
      <input type="text" formControlName="suburb" placeholder="Suburb" />
      <input type="text" formControlName="city" placeholder="City" />
    </div>
    <div class="two-col">
      <input type="text" formControlName="province" placeholder="Province" />
      <input type="text" formControlName="postalCode" placeholder="Postal code" />
    </div>
  </fieldset>

  <div class="two-col">
    <div class="field">
      <label for="fare">Your offer (R)</label>
      <input id="fare" type="number" min="1" formControlName="fare" />
    </div>
    <div class="field">
      <label for="deadlineAt">Needed by</label>
      <input id="deadlineAt" type="datetime-local" formControlName="deadlineAt" />
    </div>
  </div>

  <div class="field">
    <label>Payment method</label>
    <div class="chiprow">
      @for (method of paymentMethods; track method) {
        <button
          type="button"
          class="cat"
          [class.active]="form.controls.paymentMethod.value === method"
          (click)="form.controls.paymentMethod.setValue(method)"
        >
          {{ paymentMethodLabels[method] }}
        </button>
      }
    </div>
  </div>

  <div class="manifest">
    <div class="manifest-num">TICKET PREVIEW</div>
    <div class="manifest-desc">{{ form.controls.title.value || 'Untitled errand' }}</div>
    <div class="manifest-fare">R{{ form.controls.fare.value || 0 }}</div>
  </div>

  @if (submitError(); as err) {
    <p class="error-text">{{ err }}</p>
  }

  <button type="submit" class="cta-btn" [disabled]="submitting()">
    {{ submitting() ? 'Posting…' : 'Post to board' }}
  </button>

</form>
